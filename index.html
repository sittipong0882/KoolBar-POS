<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kool Bar (อาจารย์) — POS</title>
    <link rel="icon" href="logo/LogoKoolBar.PNG" />
    <style>
      :root {
        --bg: #0d0d0f;
        --bg2: #151518;
        --bg3: #1d1d22;
        --line: #2c2c33;
        --fg: #f2f2f4;
        --muted: #9a9aa5;
        --orange: #ff7a18;
        --green: #22c55e;
        --red: #ef4444;
        --yellow: #f5b301;
        --radius: 14px;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        min-height: 100%;
      }
      body {
        font-family: "Noto Sans Thai", "Sarabun", system-ui, sans-serif;
        background: var(--bg);
        color: var(--fg);
        font-size: 15px;
        line-height: 1.5;
        overflow-x: hidden;
      }
      .hidden {
        display: none !important;
      }
      .muted {
        color: var(--muted);
      }
      h1,
      h2,
      h3,
      h4 {
        margin: 0 0 0.5rem;
      }
      input,
      select,
      textarea {
        width: 100%;
        padding: 0.65rem 0.8rem;
        border-radius: 10px;
        background: var(--bg3);
        border: 1px solid var(--line);
        color: var(--fg);
        font-family: inherit;
        font-size: 15px;
      }
      input:focus,
      select:focus,
      textarea:focus {
        outline: 2px solid var(--orange);
        border-color: transparent;
      }
      label {
        display: block;
        font-size: 0.85rem;
        color: var(--muted);
        margin: 0.6rem 0 0.25rem;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.4rem;
        padding: 0.7rem 1.1rem;
        border-radius: 10px;
        border: 1px solid transparent;
        background: var(--bg3);
        color: var(--fg);
        font-family: inherit;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
        transition: 0.15s;
        min-height: 44px;
      }
      .btn:hover {
        filter: brightness(1.15);
      }
      .btn:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }
      .btn-primary {
        background: var(--orange);
        color: #111;
      }
      .btn-danger {
        background: var(--red);
        color: #fff;
      }
      .btn-ghost {
        background: transparent;
        border-color: var(--line);
      }
      .btn-sm {
        padding: 0.4rem 0.7rem;
        font-size: 0.85rem;
        min-height: 34px;
      }
      .btn-block {
        width: 100%;
      }
      .row {
        display: flex;
        gap: 0.6rem;
        flex-wrap: wrap;
        align-items: center;
      }
      .row > * {
        flex: 1;
      }
      .row.tight {
        gap: 0.35rem;
      }
      .grid {
        display: grid;
        gap: 0.75rem;
      }
      .g2 {
        grid-template-columns: repeat(2, 1fr);
      }
      .g3 {
        grid-template-columns: repeat(3, 1fr);
      }
      .g4 {
        grid-template-columns: repeat(4, 1fr);
      }
      @media (max-width: 900px) {
        .g3,
        .g4 {
          grid-template-columns: repeat(2, 1fr);
        }
      }
      @media (max-width: 560px) {
        .g2,
        .g3,
        .g4 {
          grid-template-columns: 1fr;
        }
      }
      .card {
        background: var(--bg2);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        padding: 1.1rem;
        margin-bottom: 1rem;
      }
      .msg {
        margin-top: 0.6rem;
        font-size: 0.9rem;
        min-height: 1.2em;
      }
      .msg.err {
        color: var(--red);
      }
      .msg.ok {
        color: var(--green);
      }
      .hint {
        font-size: 0.8rem;
        color: var(--muted);
        margin-top: 0.5rem;
      }

      .public-wrap {
        display: flex;
        flex-direction: column;
        min-height: 100vh;
      }
      .public-header {
        text-align: center;
        padding: 2.2rem 1rem 1rem;
      }
      .logo-lg {
        width: 120px;
        height: 120px;
        object-fit: contain;
        border-radius: 50%;
        background: #fff;
        padding: 0px;
        margin: 0 auto;
        display: block;
      }
      .logo-fallback {
        width: 120px;
        height: 120px;
        border-radius: 50%;
        background: #fff;
        color: #111;
        font-weight: 900;
        font-size: 2.2rem;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto;
      }
      .public-header h1 {
        font-size: 1.7rem;
        margin-top: 1rem;
      }
      .public-header h1 span {
        color: var(--orange);
        font-size: 1.1rem;
        display: block;
        margin-top: 0.15rem;
      }
      .public-header p.muted {
        margin: 0.6rem 0 0;
        font-size: 0.95rem;
      }
      .public-main {
        max-width: 640px;
        width: 100%;
        margin: 0 auto;
        padding: 0 1rem 6rem;
        flex: 1;
      }
      .check-card {
        background: var(--bg2);
        border: 1px solid var(--line);
        border-radius: 20px;
        padding: 1.6rem;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        margin-top: 1rem;
      }
      .check-card .title {
        font-size: 1.25rem;
        font-weight: 800;
        text-align: center;
        margin-bottom: 0.3rem;
      }
      .check-card .subtitle {
        text-align: center;
        font-size: 0.85rem;
        color: var(--muted);
        margin-bottom: 1.2rem;
      }
      #phoneInput {
        font-size: 1.35rem;
        letter-spacing: 2px;
        text-align: center;
        font-weight: 700;
        padding: 0.9rem;
        margin-bottom: 0.8rem;
      }

      .result-member {
        background: var(--bg2);
        border: 1px solid var(--line);
        border-radius: 20px;
        padding: 1.4rem;
        margin-top: 1rem;
      }
      .result-member .name {
        font-size: 1.3rem;
        font-weight: 800;
        margin-bottom: 1rem;
      }
      .shop-box {
        background: var(--bg3);
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 1.1rem;
        margin-bottom: 0.75rem;
      }
      .shop-box .shop-name {
        font-size: 0.95rem;
        font-weight: 700;
        margin-bottom: 0.5rem;
        color: var(--muted);
      }
      .shop-box .shop-pts {
        font-size: 2.6rem;
        font-weight: 900;
        color: var(--orange);
        line-height: 1;
        display: flex;
        align-items: baseline;
        gap: 0.4rem;
      }
      .shop-box .shop-pts span {
        font-size: 1rem;
        color: var(--muted);
        font-weight: 600;
      }
      .shop-box .progress {
        height: 8px;
        background: var(--bg);
        border-radius: 6px;
        overflow: hidden;
        margin-top: 0.75rem;
      }
      .shop-box .progress > i {
        display: block;
        height: 100%;
        background: var(--orange);
        transition: 0.4s;
      }
      .shop-box .reward-note {
        font-size: 0.82rem;
        color: var(--muted);
        margin-top: 0.5rem;
      }
      .shop-box.done {
        border-color: rgba(34, 197, 94, 0.5);
      }
      .shop-box.done .shop-pts {
        color: var(--green);
      }
      .shop-box.done .progress > i {
        background: var(--green);
      }

      #btnAdminLogin {
        position: fixed !important;
        right: 20px !important;
        bottom: 20px !important;
        width: 56px !important;
        height: 56px !important;
        border-radius: 50% !important;
        background: #1d1d22 !important;
        color: #9a9aa5 !important;
        border: 1px solid #2c2c33 !important;
        font-size: 24px !important;
        cursor: pointer !important;
        z-index: 99999 !important;
        transition: 0.2s !important;
        display: flex !important;
        align-items: center !important;
        justify-content: center !important;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6) !important;
        pointer-events: auto !important;
        padding: 0 !important;
        margin: 0 !important;
        line-height: 1 !important;
      }
      #btnAdminLogin:hover {
        color: #ff7a18 !important;
        border-color: #ff7a18 !important;
        transform: scale(1.08);
      }
      #btnAdminLogin.hidden {
        display: none !important;
      }

      .modal {
        position: fixed !important;
        inset: 0 !important;
        background: rgba(0, 0, 0, 0.85) !important;
        display: flex !important;
        align-items: center !important;
        justify-content: center !important;
        padding: 1rem !important;
        z-index: 99998 !important;
        backdrop-filter: blur(4px);
      }
      .modal-box {
        background: var(--bg2);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        padding: 1.5rem;
        width: 100%;
        max-width: 440px;
        max-height: 92vh;
        overflow: auto;
        box-shadow: 0 30px 80px rgba(0, 0, 0, 0.7);
      }
      .modal-box.wide {
        max-width: 860px;
      }
      .modal-actions {
        display: flex;
        gap: 0.6rem;
        justify-content: flex-end;
        margin-top: 1.2rem;
      }
      .login-mini-logo {
        width: 72px;
        height: 72px;
        border-radius: 50%;
        background: #fff;
        object-fit: contain;
        padding: 5px;
        margin: 0 auto 0.8rem;
        display: block;
      }

      .app {
        display: flex;
        min-height: 100vh;
      }
      .sidebar {
        width: 220px;
        background: var(--bg2);
        border-right: 1px solid var(--line);
        padding: 1rem 0.7rem;
        position: sticky;
        top: 0;
        height: 100vh;
        overflow-y: auto;
        flex-shrink: 0;
      }
      .sidebar .brand {
        display: flex;
        align-items: center;
        gap: 0.6rem;
        padding: 0.4rem 0.4rem 1rem;
        border-bottom: 1px solid var(--line);
        margin-bottom: 0.8rem;
      }
      .sidebar .brand img {
        width: 38px;
        height: 38px;
        border-radius: 50%;
        background: #fff;
        object-fit: contain;
      }
      .sidebar .brand b {
        font-size: 0.95rem;
      }
      .nav-item {
        display: block;
        width: 100%;
        text-align: left;
        padding: 0.6rem 0.7rem;
        border-radius: 9px;
        background: transparent;
        border: none;
        color: var(--muted);
        font-family: inherit;
        font-size: 0.92rem;
        cursor: pointer;
        margin-bottom: 0.15rem;
      }
      .nav-item:hover {
        background: var(--bg3);
        color: var(--fg);
      }
      .nav-item.active {
        background: var(--orange);
        color: #111;
        font-weight: 700;
      }
      .content {
        flex: 1;
        padding: 1.2rem;
        min-width: 0;
      }
      .topbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 1rem;
        gap: 1rem;
        flex-wrap: wrap;
      }
      .badge {
        display: inline-block;
        padding: 0.15rem 0.5rem;
        border-radius: 20px;
        font-size: 0.75rem;
        background: var(--bg3);
        border: 1px solid var(--line);
      }
      .badge.ok {
        background: rgba(34, 197, 94, 0.15);
        color: var(--green);
        border-color: rgba(34, 197, 94, 0.4);
      }
      .badge.warn {
        background: rgba(245, 179, 1, 0.15);
        color: var(--yellow);
        border-color: rgba(245, 179, 1, 0.4);
      }
      .badge.bad {
        background: rgba(239, 68, 68, 0.15);
        color: var(--red);
        border-color: rgba(239, 68, 68, 0.4);
      }
      @media (max-width: 860px) {
        .app {
          flex-direction: column;
        }
        .sidebar {
          width: 100%;
          height: auto;
          position: static;
          display: flex;
          overflow-x: auto;
          padding: 0.6rem;
          gap: 0.3rem;
          align-items: center;
        }
        .sidebar .brand {
          border: none;
          margin: 0;
          padding: 0.2rem 0.6rem 0.2rem 0;
        }
        .nav-item {
          white-space: nowrap;
          margin: 0;
        }
      }
      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 0.9rem;
      }
      th,
      td {
        padding: 0.55rem 0.6rem;
        text-align: left;
        border-bottom: 1px solid var(--line);
        vertical-align: middle;
      }
      th {
        color: var(--muted);
        font-weight: 600;
        font-size: 0.8rem;
        text-transform: uppercase;
        letter-spacing: 0.03em;
      }
      tbody tr:hover {
        background: var(--bg3);
      }
      .table-wrap {
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
      }
      .stat {
        background: var(--bg3);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 0.9rem;
      }
      .stat .lbl {
        font-size: 0.78rem;
        color: var(--muted);
        margin-bottom: 0.3rem;
      }
      .stat .val {
        font-size: 1.45rem;
        font-weight: 800;
        color: var(--orange);
        line-height: 1.15;
      }
      .stat .val.sm {
        font-size: 1.05rem;
      }
      .pos-wrap {
        display: grid;
        grid-template-columns: 1fr 380px;
        gap: 1rem;
        align-items: start;
      }
      @media (max-width: 1000px) {
        .pos-wrap {
          grid-template-columns: 1fr;
        }
      }
      .prod-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(122px, 1fr));
        gap: 0.6rem;
        max-height: 62vh;
        overflow: auto;
        padding-right: 0.2rem;
      }
      .prod-btn {
        background: var(--bg3);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 0.7rem 0.5rem;
        color: var(--fg);
        cursor: pointer;
        font-family: inherit;
        text-align: center;
        min-height: 96px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        gap: 0.3rem;
      }
      .prod-btn:hover {
        border-color: var(--orange);
      }
      .prod-btn .p-name {
        font-size: 0.85rem;
        font-weight: 600;
        line-height: 1.25;
      }
      .prod-btn .p-price {
        color: var(--orange);
        font-weight: 800;
        font-size: 0.95rem;
      }
      .prod-btn .p-stock {
        font-size: 0.7rem;
        color: var(--muted);
      }
      .cart-list {
        max-height: 34vh;
        overflow: auto;
        margin: 0.5rem 0;
      }
      .cart-line {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0.45rem 0;
        border-bottom: 1px dashed var(--line);
      }
      .cart-line .c-name {
        flex: 1;
        font-size: 0.9rem;
      }
      .qty-ctl {
        display: flex;
        align-items: center;
        gap: 0.25rem;
      }
      .qty-ctl button {
        width: 32px;
        height: 32px;
        border-radius: 8px;
        background: var(--bg3);
        border: 1px solid var(--line);
        color: var(--fg);
        font-size: 1.05rem;
        cursor: pointer;
      }
      .qty-ctl span {
        min-width: 26px;
        text-align: center;
        font-weight: 700;
      }
      .totals {
        border-top: 1px solid var(--line);
        padding-top: 0.7rem;
      }
      .totals .t-row {
        display: flex;
        justify-content: space-between;
        padding: 0.22rem 0;
        font-size: 0.92rem;
      }
      .totals .t-row.grand {
        font-size: 1.35rem;
        font-weight: 800;
        color: var(--orange);
        padding-top: 0.5rem;
        border-top: 1px solid var(--line);
        margin-top: 0.4rem;
      }
      .member-box {
        background: var(--bg3);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 0.75rem;
        margin-bottom: 0.7rem;
      }
      .member-box.found {
        border-color: var(--green);
      }
      .member-box.required {
        border-color: var(--yellow);
      }
      .pay-methods {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 0.5rem;
        margin: 0.6rem 0;
      }
      .pay-methods button {
        padding: 0.8rem 0.3rem;
        border-radius: 10px;
        background: var(--bg3);
        border: 1px solid var(--line);
        color: var(--fg);
        cursor: pointer;
        font-family: inherit;
        font-weight: 600;
        font-size: 0.85rem;
      }
      .pay-methods button.active {
        background: var(--orange);
        color: #111;
        border-color: var(--orange);
      }
      .money-input {
        font-size: 1.5rem;
        text-align: right;
        font-weight: 800;
      }
      .change-box {
        background: var(--bg3);
        border-radius: 10px;
        padding: 0.7rem;
        margin-top: 0.6rem;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .change-box b {
        font-size: 1.4rem;
        color: var(--green);
      }
      .gp-card {
        background: var(--bg3);
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 1rem;
        border-left: 4px solid var(--orange);
      }
      .gp-card .gp-shop {
        font-size: 0.85rem;
        color: var(--muted);
        font-weight: 600;
        margin-bottom: 0.4rem;
      }
      .gp-card .gp-amount {
        font-size: 1.8rem;
        font-weight: 900;
        color: var(--orange);
        line-height: 1;
      }
      .gp-card .gp-meta {
        font-size: 0.78rem;
        color: var(--muted);
        margin-top: 0.4rem;
      }
      #receiptArea {
        display: none;
      }
      .receipt {
        width: 78mm;
        font-family: "Sarabun", monospace;
        font-size: 12px;
        color: #000;
        background: #fff;
        padding: 6px;
      }
      .receipt h2 {
        font-size: 15px;
        text-align: center;
        margin: 0;
      }
      .receipt .center {
        text-align: center;
      }
      .receipt hr {
        border: none;
        border-top: 1px dashed #000;
        margin: 5px 0;
      }
      .receipt table {
        width: 100%;
        font-size: 12px;
        color: #000;
      }
      .receipt th,
      .receipt td {
        border: none;
        padding: 1px 0;
      }
      .receipt .r {
        text-align: right;
      }
      @media print {
        body * {
          visibility: hidden;
        }
        #receiptArea,
        #receiptArea * {
          visibility: visible;
        }
        #receiptArea {
          display: block;
          position: absolute;
          left: 0;
          top: 0;
          width: 100%;
        }
        @page {
          size: 80mm auto;
          margin: 0;
        }
      }
      .toast-wrap {
        position: fixed;
        top: 16px;
        right: 16px;
        z-index: 100000;
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
        max-width: 340px;
        pointer-events: none;
      }
      .toast {
        background: var(--bg3);
        border: 1px solid var(--line);
        border-left: 4px solid var(--orange);
        border-radius: 10px;
        padding: 0.7rem 1rem;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
        font-size: 0.9rem;
        transition: opacity 0.3s;
      }
      .toast.ok {
        border-left-color: var(--green);
      }
      .toast.err {
        border-left-color: var(--red);
      }
      .empty {
        text-align: center;
        color: var(--muted);
        padding: 2rem 1rem;
        font-size: 0.9rem;
      }
      .spinner {
        display: inline-block;
        width: 16px;
        height: 16px;
        border: 2px solid var(--line);
        border-top-color: var(--orange);
        border-radius: 50%;
        animation: spin 0.7s linear infinite;
        vertical-align: -3px;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>

    <script type="importmap">
      {
        "imports": {
          "firebase/app": "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js",
          "firebase/firestore": "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js"
        }
      }
    </script>
  </head>
  <body>
    <div id="viewPublic" class="public-wrap">
      <div class="public-header">
        <img
          src="logo/LogoKoolBar.PNG"
          alt="Kool Bar"
          class="logo-lg"
          onerror="
            this.outerHTML = '<div class=&quot;logo-fallback&quot;>KB</div>'
          "
        />
        <h1>Kool Bar (อาจารย์)</h1>
        <p class="muted">ระบบสมาชิกและสะสมแต้ม</p>
      </div>

      <div class="public-main">
        <div class="check-card">
          <div class="title">ตรวจสอบคะแนนสะสม</div>
          <div class="subtitle">กรอกเบอร์โทรศัพท์ที่ใช้สมัครสมาชิก</div>

          <input
            id="phoneInput"
            type="tel"
            inputmode="numeric"
            maxlength="10"
            placeholder="08XXXXXXXX"
            autocomplete="tel"
          />
          <button
            id="btnCheckPoints"
            type="button"
            class="btn btn-primary btn-block"
            style="min-height: 52px; font-size: 1.05rem"
          >
            🔍 ตรวจสอบคะแนน
          </button>

          <div id="checkMsg" class="msg" style="text-align: center"></div>

    <script type="module">
      /* =====================================================================

      const firebaseConfig = {

      const C = {

      const SHOP_IDS = Object.keys(SHOPS);

      /* ===== กติกาคะแนนเริ่มต้น: นับเป็นถ้วย (perUnit) 1 แต้ม/ถ้วย ===== */
      const DEFAULT_POINTS = {
        shops: {
          meath: {
            mode: "perUnit",
            pointsPerUnit: 1,
            pointsPerBill: 0,
            amountPerPoint: 0,
            redeemThreshold: 10,
            rewardDescription: "แลกฟรี 1 รายการ",
          },
          drink: {
            mode: "perUnit",

            amountPerPoint: 0,
            redeemThreshold: 10,
            rewardDescription: "แลกฟรี 1 รายการ",
          },
        },
      };
      const DEFAULT_GP = { default: 0, meath: 0, drink: 0 };

      /* ---------- UTILS ---------- */
      const $ = (id) => document.getElementById(id);
      const el = (h) => {
        const t = document.createElement("template");
        t.innerHTML = h.trim();
        return t.content.firstElementChild;
      };
      const esc = (s) =>
        String(s ?? "").replace(
          /[&<>"']/g,
          (c) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[c],
        );
      const fmtTHB = (n) =>
        Number(n || 0).toLocaleString("th-TH", {
          minimumFractionDigits: 2,
          maximumFractionDigits: 2,
        });
      const fmtNum = (n, d = 0) =>
        Number(n || 0).toLocaleString("th-TH", {
          minimumFractionDigits: d,
          maximumFractionDigits: d,
        });
      const pad = (n) => String(n).padStart(2, "0");
      const dateKey = (d = new Date()) =>
        `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
      const toDate = (v) => {
        if (!v) return null;
        if (v instanceof Date) return v;
        if (v?.toDate) return v.toDate();
        return new Date(v);
      };
      const fmtDT = (v) => {
        const d = toDate(v);
        return d
          ? d.toLocaleString("th-TH", {
              dateStyle: "short",
              timeStyle: "short",
            })
          : "-";
      };
      const fmtD = (v) => {
        const d = toDate(v);
        return d ? d.toLocaleDateString("th-TH", { dateStyle: "medium" }) : "-";
      };
      const sod = (d = new Date()) => {
        const x = new Date(d);
        x.setHours(0, 0, 0, 0);
        return x;
      };
      const eod = (d = new Date()) => {
        const x = new Date(d);
        x.setHours(23, 59, 59, 999);
        return x;
      };

      function normalizePhone(raw) {
        let d = String(raw ?? "").replace(/\D/g, "");
        if (d.startsWith("66")) d = "0" + d.slice(2);
        if (d.length === 9 && d.startsWith("0")) d = "0" + d;
        return d;
      }
      const isValidPhone = (raw) => /^0\d{8,9}$/.test(normalizePhone(raw));
      const maskPhone = (p) => {
        const d = normalizePhone(p);
        return d.length >= 6 ? d.slice(0, 3) + "****" + d.slice(-2) : "***";
      };

      async function sha256Hex(text) {
        const buf = await crypto.subtle.digest(
          "SHA-256",
          new TextEncoder().encode(text),
        );
        return [...new Uint8Array(buf)]
          .map((b) => b.toString(16).padStart(2, "0"))
          .join("");
      }
      const memberId = (phone) => sha256Hex(normalizePhone(phone));

      function toast(msg, type = "info", ms = 3200) {
        let w = document.querySelector(".toast-wrap");
        if (!w) {
          w = el('<div class="toast-wrap"></div>');
          document.body.appendChild(w);
        }
        const t = el(`<div class="toast ${type}">${esc(msg)}</div>`);
        w.appendChild(t);
        setTimeout(() => {
          t.style.opacity = "0";
          setTimeout(() => t.remove(), 300);
        }, ms);
      }
      const setMsg = (n, txt, k = "") => {
        if (!n) return;
        n.textContent = txt || "";
        n.className = "msg " + k;
      };

      function confirmDialog(
        message,
        { title = "ยืนยัน", okText = "ยืนยัน", danger = false } = {},
      ) {
        return new Promise((resolve) => {
          const m = el(`<div class="modal"><div class="modal-box">
      <h3>${esc(title)}</h3><p style="white-space:pre-wrap">${esc(message)}</p>
      <div class="modal-actions">
        <button type="button" class="btn btn-ghost" data-a="cancel">ยกเลิก</button>
        <button type="button" class="btn ${danger ? "btn-danger" : "btn-primary"}" data-a="ok">${esc(okText)}</button>
      </div></div></div>`);
          document.body.appendChild(m);
          m.addEventListener("click", (e) => {
            const a = e.target.dataset?.a;
            if (a === "ok") {
              m.remove();
              resolve(true);
            }
            if (a === "cancel" || e.target === m) {
              m.remove();
              resolve(false);
            }
          });
        });
      }
      async function audit(action, detail) {
        try {
          await addDoc(collection(db, C.auditLogs), {
            action,
            detail: detail ?? {},
            userName: LOGIN_USER,
            createdAt: serverTimestamp(),
          });
        } catch (e) {}
      }
      function downloadCSV(filename, headers, rows) {
        const q = (v) => `"${String(v ?? "").replace(/"/g, '""')}"`;
        const csv =
          "\uFEFF" +
          [
            headers.map(q).join(","),
            ...rows.map((r) => r.map(q).join(",")),
          ].join("\r\n");
        const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = filename;
        a.click();
        setTimeout(() => URL.revokeObjectURL(a.href), 1500);
      }

      async function getSetting(id) {
        const snap = await getDoc(doc(db, C.settings, id));
        return snap.exists() ? snap.data() : null;
      }
      async function saveSetting(id, data) {
        await setDoc(
          doc(db, C.settings, id),
          { ...data, updatedAt: serverTimestamp() },
          { merge: true },
        );
      }

      /* ---------- STATE ---------- */
      const state = {
        pointsCfg: DEFAULT_POINTS,
        gpPercent: { ...DEFAULT_GP },
        isAdmin: false,
        shopId: null,
        products: [],
        cart: new Map(),
        member: null,
        shift: null,
        clientToken: null,
        redeem: false,
        discount: 0,
        change: 0,
      };
      const invDocId = (sid, pid) => `${sid}__${pid}`;
      const newToken = () =>
        crypto.randomUUID
          ? crypto.randomUUID()
          : "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g, (c) => {
              const r = (Math.random() * 16) | 0;
              return (c === "x" ? r : (r & 0x3) | 0x8).toString(16);
            });
      const emptyPoints = () => ({ meath: 0, drink: 0 });

      function getGpPct(shopId) {
        const g = state.gpPercent || {};
        const v = Number(g[shopId]);
        if (Number.isFinite(v) && v > 0) return v;
        return Number(g.default) || 0;
      }

      const calcTotals = () => {
        let sub = 0;
        for (const { product, qty } of state.cart.values())
          sub += Number(product.price || 0) * qty;
        const d = Number(state.discount || 0);
        return { subtotal: sub, discount: d, total: Math.max(0, sub - d) };
      };
      const redeemThreshold = (sid) =>
        Math.max(
          1,
          Math.floor(
            Number(state.pointsCfg?.shops?.[sid]?.redeemThreshold) || 10,
          ),
        );

      /* =====================================================================
   ★ calcEarned — คิดแต้มตามกติกา (v7 เพิ่ม perUnit)
   - perUnit   : นับจำนวนชิ้น/ถ้วย × pointsPerUnit (ค่าเริ่มต้น 1)
   - perBill   : แต้มคงที่ต่อบิล
   - perAmount : ทุก ๆ amountPerPoint บาท = 1 แต้ม
   ★ รับ items เพื่อให้รู้จำนวนชิ้นในตะกร้า
   ===================================================================== */
      function calcEarned(sid, total, items) {
        const c = state.pointsCfg?.shops?.[sid];
        if (!c) return 0;

        // นับเป็นถ้วย/ชิ้น
        if (c.mode === "perUnit") {
          const perUnit = Math.max(0, Number(c.pointsPerUnit));
          const rate = Number.isFinite(perUnit) ? perUnit : 1;
          if (rate <= 0) return 0;
          const list = Array.isArray(items) ? items : [];
          let totalQty = 0;
          for (const it of list) {
            // รองรับทั้ง {qty} และ {product,qty}
            const q = Number(it?.qty ?? 0);
            if (Number.isFinite(q) && q > 0) totalQty += q;
          }
          return Math.max(0, Math.floor(totalQty * rate));
        }

        // แต้มต่อบิล
        if (c.mode === "perBill")
          return Math.max(0, Math.floor(Number(c.pointsPerBill) || 0));

        // แต้มตามยอดซื้อ
        if (c.mode === "perAmount") {
          const per = Number(c.amountPerPoint) || 0;
          return per > 0 ? Math.max(0, Math.floor(total / per)) : 0;
        }

        return 0;
      }

      /* ---------- VIEW SWITCH ---------- */
      function showPublicView() {
        $("viewPublic").classList.remove("hidden");
        $("app").classList.add("hidden");
        $("btnAdminLogin").classList.remove("hidden");
        state.isAdmin = false;
        $("checkResult").classList.add("hidden");
        $("checkResult").innerHTML = "";
        $("phoneInput").value = "";
        setMsg($("checkMsg"), "");
      }
      function showAdminView() {
        $("viewPublic").classList.add("hidden");
        $("app").classList.remove("hidden");
        $("btnAdminLogin").classList.add("hidden");
        state.isAdmin = true;
      }

      /* ---------- LOGIN MODAL ---------- */
      function openLoginModal() {
        if (document.getElementById("adminLoginModal")) return;

        const m =
          el(`<div id="adminLoginModal" class="modal"><div class="modal-box">
    <img src="logo/LogoKoolBar.PNG" class="login-mini-logo" alt="Kool Bar"
         onerror="this.outerHTML='<div class=&quot;logo-fallback&quot; style=&quot;width:72px;height:72px;font-size:1.4rem&quot;>KB</div>'">
    <h3 style="text-align:center;margin-bottom:.2rem">เข้าสู่ระบบพนักงาน</h3>
    <p class="muted" style="text-align:center;font-size:.85rem;margin:0 0 1rem">สำหรับผู้ดูแลและพนักงานขายเท่านั้น</p>
    <label for="loginUser">ชื่อผู้ใช้</label>
    <input id="loginUser" type="text" autocomplete="username" placeholder="adminkoolbar">
    <label for="loginPass">รหัสผ่าน</label>
    <input id="loginPass" type="password" autocomplete="current-password" placeholder="••••••••">
    <div class="msg err" id="loginErr"></div>
    <div class="modal-actions">
      <button type="button" id="loginCancelBtn" class="btn btn-ghost">ยกเลิก</button>
      <button type="button" id="loginOkBtn" class="btn btn-primary">เข้าสู่ระบบ</button>
    </div>
  </div></div>`);
        document.body.appendChild(m);

        const uIn = m.querySelector("#loginUser");
        const pIn = m.querySelector("#loginPass");
        const err = m.querySelector("#loginErr");

        setTimeout(() => {
          try {
            uIn.focus();
          } catch (e) {}
        }, 100);

        const closeModal = () => {
          if (m.parentNode) m.remove();
        };

        const tryLogin = async () => {
          const u = (uIn.value || "").trim();
          const p = pIn.value || "";
          if (!u || !p) {
            setMsg(err, "กรอกชื่อผู้ใช้และรหัสผ่าน", "err");
            return;
          }
          if (u !== LOGIN_USER || p !== LOGIN_PASS) {
            setMsg(err, "ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง", "err");
            return;
          }
          closeModal();
          try {
            localStorage.setItem(SESSION_KEY, "1");
          } catch (e) {}
          toast("ยินดีต้อนรับเข้าสู่ระบบ", "ok");
          try {
            await loadSettings();
          } catch (e) {
            console.warn("loadSettings:", e);
          }
          showAdminView();
          renderNav();
          try {
            await navigate("dashboard");
          } catch (e) {
            console.error(e);
          }
        };

        m.querySelector("#loginOkBtn").addEventListener("click", (e) => {
          e.preventDefault();
          e.stopPropagation();
          tryLogin();
        });
        m.querySelector("#loginCancelBtn").addEventListener("click", (e) => {
          e.preventDefault();
          e.stopPropagation();
          closeModal();
        });

        const onEnter = (e) => {
          if (e.key === "Enter") {
            e.preventDefault();
            tryLogin();
          }
        };
        uIn.addEventListener("keydown", onEnter);
        pIn.addEventListener("keydown", onEnter);
        m.addEventListener("click", (e) => {
          if (e.target === m) closeModal();
        });
      }

      /* ---------- LOGOUT ---------- */
      function doLogout() {
        try {
          localStorage.removeItem(SESSION_KEY);
        } catch (e) {}
        state.cart.clear();
        state.member = null;
        state.shift = null;
        state.shopId = null;
        state.clientToken = null;
        state.isAdmin = false;
        showPublicView();
        toast("ออกจากระบบแล้ว", "info");
      }

      /* ---------- CUSTOMER: CHECK POINTS ---------- */
      async function checkPoints() {
        const phone = normalizePhone($("phoneInput").value);
        const msg = $("checkMsg");
        const result = $("checkResult");

        if (!isValidPhone(phone)) {
          setMsg(
            msg,
            "กรุณากรอกเบอร์โทรศัพท์ให้ถูกต้อง (10 หลัก เริ่มด้วย 0)",
            "err",
          );
          return;
        }
        setMsg(msg, "กำลังตรวจสอบ…");
        result.classList.add("hidden");
        $("btnCheckPoints").disabled = true;

        try {
          const id = await memberId(phone);
          const snap = await getDoc(doc(db, C.members, id));

          if (!snap.exists()) {
            setMsg(
              msg,
              "ไม่พบสมาชิกสำหรับเบอร์นี้ — สมัครได้ที่เคาน์เตอร์ร้าน",
              "err",
            );
            return;
          }
          const m = snap.data();
          if (m.status === "blocked") {
            setMsg(msg, "บัญชีนี้ถูกระงับการใช้งาน กรุณาติดต่อพนักงาน", "err");
            return;
          }
          setMsg(msg, "", "");

          const cfg = state.pointsCfg?.shops || DEFAULT_POINTS.shops;
          const pts = { ...emptyPoints(), ...(m.points || {}) };

          const boxes = SHOP_IDS.map((sid) => {
            const shop = SHOPS[sid];
            const c = cfg[sid] || {};
            const th = Math.max(1, Number(c.redeemThreshold) || 10);
            const cur = Number(pts[sid] || 0);
            const reward =
              c.rewardDescription?.trim() || `แลกรางวัลฟรี 1 รายการ`;
            const pct = Math.min(100, Math.round(((cur % th) / th) * 100));
            const isDone = cur >= th;
            const remain = isDone ? 0 : th - cur;
            return `<div class="shop-box ${isDone ? "done" : ""}">
        <div class="shop-name">${esc(shop.name)}</div>
        <div class="shop-pts">${cur} <span>แต้ม</span></div>
        <div class="progress"><i style="width:${isDone ? 100 : pct}%"></i></div>
        <div class="reward-note">
          ${
            isDone
              ? `🎉 ครบ ${th} แต้มแล้ว — ${esc(reward)}`
              : `อีก ${remain} แต้ม จะครบ ${th} แต้ม — ${esc(reward)}`
          }
        </div>
      </div>`;
          }).join("");

          result.innerHTML = `
      <div class="result-member">
        <div class="name">👋 ${esc(m.displayName || "คุณ" + (m.nickname || ""))}</div>
        ${boxes}
        <p class="hint" style="text-align:center;margin-top:1rem">
          คะแนนแยกตามร้าน ไม่สามารถนำข้ามร้านมารวมกันได้<br>
          อัปเดตล่าสุด ${new Date().toLocaleString("th-TH")}
        </p>
      </div>`;
          result.classList.remove("hidden");
        } catch (e) {
          console.error(e);
          setMsg(
            msg,
            "เกิดข้อผิดพลาด: " + (e.message || "ไม่ทราบสาเหตุ"),
            "err",
          );
        } finally {
          $("btnCheckPoints").disabled = false;
        }
      }

      /* ---------- LOAD SETTINGS ---------- */
      async function loadSettings() {
        try {
          const [pt, shop] = await Promise.all([
            getSetting("points"),
            getSetting("shop"),
          ]);
          if (pt?.shops) state.pointsCfg = pt;
          if (shop?.gpPercent) {
            state.gpPercent = {
              default: Number(shop.gpPercent.default || 0),
              meath: Number(shop.gpPercent.meath || 0),
              drink: Number(shop.gpPercent.drink || 0),
            };
          } else {
            state.gpPercent = { ...DEFAULT_GP };
          }
        } catch (e) {
          console.warn("loadSettings:", e.message);
        }
      }

      /* ---------- ROUTER ---------- */
      const PAGES = [
        { id: "dashboard", label: "📊 แดชบอร์ด", render: renderDashboard },
        { id: "pos", label: "🛒 ขายสินค้า", render: renderPOS },
        { id: "products", label: "📦 สินค้า", render: renderProducts },
        { id: "inventory", label: "🏷️ สต๊อก", render: renderInventory },
        { id: "members", label: "👥 สมาชิก", render: renderMembers },
        { id: "expenses", label: "💸 รายจ่าย", render: renderExpenses },
        { id: "reports", label: "📈 รายงาน", render: renderReports },
        { id: "settings", label: "⚙️ ตั้งค่า", render: renderSettings },
      ];
      function renderNav() {
        $("navWrap").innerHTML = PAGES.map(
          (p, i) =>
            `<button type="button" class="nav-item ${i === 0 ? "active" : ""}" data-page="${p.id}">${esc(p.label)}</button>`,
        ).join("");
        $("navWrap").addEventListener("click", (e) => {
          const id = e.target.dataset?.page;
          if (id) navigate(id);
        });
        $("whoami").textContent = "adminkoolbar • ผู้ดูแลร้าน";
      }
      async function navigate(id) {
        const page = PAGES.find((p) => p.id === id);
        if (!page) return;
        document
          .querySelectorAll("#navWrap .nav-item")
          .forEach((b) => b.classList.toggle("active", b.dataset.page === id));
        $("pageTitle").textContent = page.label.replace(/^[^\s]+\s/, "");
        $("view").innerHTML =
          `<div class="card"><span class="spinner"></span> กำลังโหลด…</div>`;
        try {
          await page.render();
        } catch (e) {
          console.error(e);
          $("view").innerHTML =
            `<div class="card"><div class="msg err">โหลดไม่สำเร็จ: ${esc(e.message)}</div>
      <button type="button" class="btn btn-ghost btn-sm" onclick="location.reload()">โหลดใหม่</button></div>`;
        }
      }

      /* ---------- DASHBOARD ---------- */
      async function renderDashboard() {
        const now = new Date();
        const [salesSnap, expSnap, invSnap, prodSnap] = await Promise.all([
          getDocs(
            query(
              collection(db, C.sales),
              where("createdAt", ">=", sod(now)),
              where("createdAt", "<=", eod(now)),
              limit(500),
            ),
          ),
          getDocs(
            query(
              collection(db, C.expenses),
              where("date", ">=", sod(now)),
              where("date", "<=", eod(now)),
              limit(200),
            ),
          ),
          getDocs(collection(db, C.inventory)),
          getDocs(collection(db, C.products)),
        ]);
        const sales = salesSnap.docs
          .map((d) => ({ id: d.id, ...d.data() }))
          .filter((s) => s.status === "completed");
        const expenses = expSnap.docs.map((d) => ({ id: d.id, ...d.data() }));
        const prodMap = new Map(prodSnap.docs.map((d) => [d.id, d.data()]));

        let total = 0,
          cash = 0,
          transfer = 0,
          cost = 0;
        const byShop = Object.fromEntries(
          SHOP_IDS.map((s) => [
            s,
            {
              total: 0,
              count: 0,
              cost: 0,
              gpPct: getGpPct(s),
              gp: 0,
              grossProfit: 0,
            },
          ]),
        );
        for (const s of sales) {
          const t = Number(s.total || 0);
          total += t;
          cost += Number(s.grossCost || 0);
          if (byShop[s.shopId]) {
            byShop[s.shopId].total += t;
            byShop[s.shopId].count++;
            byShop[s.shopId].cost += Number(s.grossCost || 0);
          }
          for (const p of s.payments || []) {
            if (p.method === "cash") cash += Number(p.amount || 0);
            if (p.method === "transfer") transfer += Number(p.amount || 0);
          }
        }
        let totalGp = 0;
        for (const sid of SHOP_IDS) {
          const bs = byShop[sid];
          bs.gp = (bs.total * bs.gpPct) / 100;
          bs.grossProfit = bs.total - bs.cost;
          totalGp += bs.gp;
        }

        const expTotal = expenses.reduce(
          (a, e) => a + Number(e.amount || 0),
          0,
        );
        let stockValue = 0,
          low = 0;
        for (const d of invSnap.docs) {
          const inv = d.data(),
            p = prodMap.get(inv.productId) || {};
          const qty = Number(inv.qty || 0);
          stockValue += qty * Number(p.cost || 0);
          const min = Number(inv.minQty ?? p.minQty ?? 0);
          if (min > 0 && qty <= min) low++;
        }

        $("view").innerHTML = `
    <div class="grid g4">
      <div class="stat"><div class="lbl">ยอดขายวันนี้</div><div class="val">฿${fmtTHB(total)}</div>
        <div class="muted" style="font-size:.75rem">${sales.length} บิล</div></div>
      <div class="stat"><div class="lbl">เงินสด / เงินโอน</div><div class="val sm">฿${fmtTHB(cash)} / ฿${fmtTHB(transfer)}</div></div>
      <div class="stat"><div class="lbl">ต้นทุนขาย</div><div class="val sm">฿${fmtTHB(cost)}</div></div>
      <div class="stat"><div class="lbl">กำไรขั้นต้น</div>
        <div class="val sm" style="color:${total - cost >= 0 ? "var(--green)" : "var(--red)"}">฿${fmtTHB(total - cost)}</div></div>
    </div>

    <div class="card" style="margin-top:1rem">
      <h4>💼 ยอดขาย & GP แยกร้าน</h4>
      <div class="grid g2">
        ${SHOP_IDS.map((sid) => {
          const bs = byShop[sid];
          return `<div class="gp-card">
            <div class="gp-shop">${esc(SHOPS[sid].name)} (GP ${bs.gpPct}%)</div>
            <div class="grid g3" style="gap:.5rem;margin-top:.5rem">
              <div>
                <div class="muted" style="font-size:.72rem">ยอดขาย</div>
                <div style="font-weight:800;font-size:1.1rem">฿${fmtTHB(bs.total)}</div>
                <div class="muted" style="font-size:.72rem">${bs.count} บิล</div>
              </div>
              <div>
                <div class="muted" style="font-size:.72rem">กำไรขั้นต้น</div>
                <div style="font-weight:800;font-size:1.1rem;color:${bs.grossProfit >= 0 ? "var(--green)" : "var(--red)"}">฿${fmtTHB(bs.grossProfit)}</div>
                <div class="muted" style="font-size:.72rem">ต้นทุน ฿${fmtTHB(bs.cost)}</div>
              </div>
              <div>
                <div class="muted" style="font-size:.72rem">GP ที่ต้องจ่าย</div>
                <div class="gp-amount">฿${fmtTHB(bs.gp)}</div>
              </div>
            </div>
          </div>`;
        }).join("")}
      </div>
      <div class="gp-card" style="margin-top:.75rem;border-left-color:var(--green)">
        <div class="gp-shop">รวม GP ทั้งกิจการ</div>
        <div class="gp-amount" style="color:var(--green)">฿${fmtTHB(totalGp)}</div>
        <div class="gp-meta">= ฿${fmtTHB(byShop.meath.gp)} (${esc(SHOPS.meath.name)}) + ฿${fmtTHB(byShop.drink.gp)} (${esc(SHOPS.drink.name)})</div>
      </div>
    </div>

    <div class="grid g3" style="margin-top:1rem">
      <div class="card"><h4>รายจ่ายวันนี้</h4>
        <div style="font-size:1.5rem;font-weight:800;color:var(--red)">฿${fmtTHB(expTotal)}</div></div>
      <div class="card"><h4>กำไรหลังหัก GP + รายจ่าย</h4>
        <div style="font-size:1.5rem;font-weight:800;color:${total - cost - totalGp - expTotal >= 0 ? "var(--green)" : "var(--red)"}">฿${fmtTHB(total - cost - totalGp - expTotal)}</div></div>
      <div class="card"><h4>มูลค่าสต๊อกรวม</h4>
        <div style="font-size:1.5rem;font-weight:800">฿${fmtTHB(stockValue)}</div>
        ${
          low > 0
            ? `<div class="badge warn" style="margin-top:.4rem">${low} รายการใกล้หมด</div>`
            : `<div class="badge ok" style="margin-top:.4rem">สต๊อกปกติ</div>`
        }</div>
    </div>

    <div class="card" style="margin-top:1rem">
      <h4>บิลล่าสุด</h4>
      ${salesTable(sales.slice(0, 10))}
    </div>`;
      }
      function salesTable(sales) {
        if (!sales.length)
          return `<div class="empty">ยังไม่มีข้อมูลการขาย</div>`;
        return `<div class="table-wrap"><table>
    <thead><tr><th>บิล</th><th>เวลา</th><th>ร้าน</th><th>สมาชิก</th>
      <th style="text-align:right">สุทธิ</th><th>ชำระ</th><th>สถานะ</th></tr></thead>
    <tbody>${sales
      .map(
        (s) => `
      <tr>
        <td><b>${esc(s.billNo)}</b></td>
        <td>${fmtDT(s.createdAt)}</td>
        <td>${esc(shopName(s.shopId))}</td>
        <td>${esc(s.memberDisplayName || "-")}<br>
          <span class="muted" style="font-size:.75rem">${esc(s.memberPhoneMasked || "")}</span></td>
        <td style="text-align:right">฿${fmtTHB(s.total)}</td>
        <td>${esc((s.payments || []).map((p) => (p.method === "cash" ? "สด" : "โอน")).join("+"))}</td>
        <td>${s.status === "completed" ? `<span class="badge ok">สำเร็จ</span>` : `<span class="badge bad">ยกเลิก</span>`}</td>
      </tr>`,
      )
      .join("")}</tbody></table></div>`;
      }

        $("posShop").addEventListener("change", async (e) => {
          state.shopId = e.target.value || null;
          state.cart.clear();
          state.member = null;
          $("posWrap").classList.add("hidden");
          $("shiftPanel").innerHTML = "";
          if (!state.shopId) return;
          await loadSettings();
          await refreshShift();
        });
        if (state.shopId) await refreshShift();
      }

      async function refreshShift() {
        const snap = await getDocs(
          query(
            collection(db, C.shifts),
            where("shopId", "==", state.shopId),
            limit(20),
          ),
        );
        const opens = snap.docs.filter((d) => d.data().status === "open");
        if (!opens.length) {
          state.shift = null;
          renderShiftOpen();
        } else {
          state.shift = { id: opens[0].id, ...opens[0].data() };
          renderShiftOpen(true);
          await enterSellUI();
        }
      }
      function renderShiftOpen(open = false) {
        if (open) {
          const s = state.shift;
          $("shiftPanel").innerHTML = `
      <div class="card" style="border-color:rgba(34,197,94,.4)">
        <div class="row">
          <div style="flex:2"><b>✅ กะเปิดอยู่</b> — ${esc(shopName(state.shopId))}
            <span class="muted">เปิด ${fmtDT(s.openedAt)} • เงินสดตั้งต้น ฿${fmtTHB(s.openingCash)}</span></div>
          <button type="button" id="btnCloseShift" class="btn btn-ghost btn-sm" style="flex:0 0 auto">ปิดกะ</button>
        </div>
      </div>`;
          $("btnCloseShift").addEventListener("click", doCloseShift);
          return;
        }
        $("shiftPanel").innerHTML = `
    <div class="card" style="border-color:rgba(245,179,1,.4)">
      <h3 style="font-size:1rem">🔓 เปิดกะก่อนเริ่มขาย</h3>
      <label>เงินสดตั้งต้นในลิ้นชัก (บาท)</label>
      <input id="openCash" type="number" min="0" step="1" value="0" style="max-width:220px">
      <div class="msg" id="openMsg"></div>
      <button type="button" id="btnOpenShift" class="btn btn-primary" style="margin-top:.7rem">เปิดกะ</button>
    </div>`;
        $("btnOpenShift").addEventListener("click", async () => {
          const cash = Number($("openCash").value) || 0;
          $("btnOpenShift").disabled = true;
          try {
            const ref = await addDoc(collection(db, C.shifts), {
              shopId: state.shopId,
              openingCash: cash,
              openedAt: serverTimestamp(),
              status: "open",
              cashSales: 0,
              transferSales: 0,
              salesTotal: 0,
              billCount: 0,
              refunds: 0,
              cashOut: 0,
            });
            state.shift = {
              id: ref.id,
              shopId: state.shopId,
              openingCash: cash,
              cashSales: 0,
              transferSales: 0,
              refunds: 0,
            };
            toast("เปิดกะเรียบร้อย", "ok");
            renderShiftOpen(true);
            await enterSellUI();
          } catch (e) {
            setMsg($("openMsg"), e.message, "err");
            $("btnOpenShift").disabled = false;
          }
        });
      }
      async function doCloseShift() {
        const fresh = state.shift;
        const expected =
          Number(fresh.openingCash || 0) +
          Number(fresh.cashSales || 0) -
          Number(fresh.refunds || 0);
        const m = el(`<div class="modal"><div class="modal-box">
    <h3>ปิดกะ</h3>
    <div class="stat" style="margin-bottom:.6rem">
      <div class="lbl">เงินสดที่ควรมี</div>
      <div class="val">฿${fmtTHB(expected)}</div>
    </div>
    <label>เงินสดที่นับได้จริง</label>
    <input id="csCash" type="number" min="0" step="1" value="0" class="money-input">
    <label>เงินสดที่เบิกออกระหว่างกะ</label>
    <input id="csOut" type="number" min="0" step="1" value="0">
    <label>หมายเหตุ</label>
    <input id="csNote" placeholder="ไม่บังคับ">
    <div class="stat" style="margin-top:.7rem">
      <div class="lbl">ยอดขาด/เกิน</div>
      <div class="val" id="csDiff">0.00</div>
    </div>
    <div class="modal-actions">
      <button type="button" class="btn btn-ghost" data-a="cancel">ยกเลิก</button>
      <button type="button" class="btn btn-primary" data-a="ok">ยืนยันปิดกะ</button>
    </div></div></div>`);
        document.body.appendChild(m);
        const ci = m.querySelector("#csCash"),
          co = m.querySelector("#csOut"),
          cd = m.querySelector("#csDiff");
        const recalc = () => {
          const d =
            (Number(ci.value) || 0) - (expected - (Number(co.value) || 0));
          cd.textContent = fmtTHB(d);
          cd.style.color = Math.abs(d) < 0.01 ? "var(--green)" : "var(--red)";
        };
        ci.addEventListener("input", recalc);
        co.addEventListener("input", recalc);
        recalc();

        m.addEventListener("click", async (e) => {
          const a = e.target.dataset?.a;
          if (a === "cancel" || e.target === m) {
            m.remove();
            return;
          }
          if (a !== "ok") return;
          e.target.disabled = true;
          try {
            const cashOut = Number(co.value) || 0;
            const counted = Number(ci.value) || 0;
            const finalExpected = expected - cashOut;
            await updateDoc(doc(db, C.shifts, fresh.id), {
              status: "closed",
              closedAt: serverTimestamp(),
              closingCash: counted,
              expectedCash: finalExpected,
              difference: counted - finalExpected,
              cashOut,
              closeNote: m.querySelector("#csNote").value.trim(),
            });
            m.remove();
            toast(
              `ปิดกะแล้ว — ขาด/เกิน ฿${fmtTHB(counted - finalExpected)}`,
              Math.abs(counted - finalExpected) < 0.01 ? "ok" : "err",
            );
            state.shift = null;
            $("posWrap").classList.add("hidden");
            await refreshShift();
          } catch (e2) {
            toast(e2.message, "err");
            e.target.disabled = false;
          }
        });
      }

      async function enterSellUI() {
        $("posWrap").classList.remove("hidden");
        const snap = await getDocs(
          query(
            collection(db, C.products),
            where("shopId", "==", state.shopId),
            limit(500),
          ),
        );
        state.products = snap.docs
          .map((d) => ({ id: d.id, ...d.data() }))
          .filter((p) => p.active !== false)
          .sort(
            (a, b) =>
              (a.category || "").localeCompare(b.category || "", "th") ||
              a.name.localeCompare(b.name, "th"),
          );

        const cats = [
          ...new Set(state.products.map((p) => p.category || "อื่นๆ")),
        ].sort();
        $("catFilter").innerHTML =
          `<button type="button" class="btn btn-sm btn-primary" data-cat="">ทั้งหมด</button>` +
          cats
            .map(
              (c) =>
                `<button type="button" class="btn btn-sm" data-cat="${esc(c)}">${esc(c)}</button>`,
            )
            .join("");
        $("catFilter").addEventListener("click", (e) => {
          const c = e.target.dataset?.cat;
          if (c === undefined) return;
          $("catFilter")
            .querySelectorAll("button")
            .forEach((b) => b.classList.remove("btn-primary"));
          e.target.classList.add("btn-primary");
          drawProducts(c, $("prodSearch").value);
        });
        $("prodSearch").addEventListener("input", (e) => {
          const cat =
            $("catFilter").querySelector(".btn-primary")?.dataset.cat || "";
          drawProducts(cat, e.target.value);
        });
        $("discountInput").addEventListener("input", (e) => {
          state.discount = Math.max(0, Number(e.target.value) || 0);
          drawCart();
        });
        $("btnClear").addEventListener("click", async () => {
          if (!state.cart.size) return;
          if (await confirmDialog("ล้างตะกร้าทั้งหมด?", { danger: true })) {
            state.cart.clear();
            state.member = null;
            state.discount = 0;
            state.redeem = false;
            $("discountInput").value = "0";
            $("memPhone").value = "";
            drawCart();
            drawMember();
          }
        });
        $("btnFindMem").addEventListener("click", findMember);
        $("memPhone").addEventListener("keydown", (e) => {
          if (e.key === "Enter") findMember();
        });
        $("memPhone").addEventListener("input", (e) => {
          e.target.value = e.target.value.replace(/\D/g, "").slice(0, 10);
        });
        $("btnNewMem").addEventListener("click", openNewMemberModal);
        $("btnCheckout").addEventListener("click", openPayModal);

        drawProducts();
        drawCart();
        drawMember();
        $("discountInput").value = "0";
      }
      function drawProducts(cat = "", kw = "") {
        const q = kw.trim().toLowerCase();
        let list = state.products;
        if (cat) list = list.filter((p) => (p.category || "อื่นๆ") === cat);
        if (q)
          list = list.filter(
            (p) =>
              (p.name || "").toLowerCase().includes(q) ||
              (p.sku || "").toLowerCase().includes(q) ||
              (p.barcode || "").includes(q),
          );
        if (!list.length) {
          $("prodGrid").innerHTML =
            `<div class="empty" style="grid-column:1/-1">ไม่พบสินค้า</div>`;
          return;
        }
        $("prodGrid").innerHTML = list
          .map(
            (p) => `
    <button type="button" class="prod-btn" data-id="${esc(p.id)}">
      <div class="p-name">${esc(p.name)}</div>
      <div class="p-price">฿${fmtTHB(p.price)}</div>
      <div class="p-stock">${esc(p.unit || "")}</div>
    </button>`,
          )
          .join("");
        $("prodGrid")
          .querySelectorAll(".prod-btn")
          .forEach((b) =>
            b.addEventListener("click", () => {
              const p = state.products.find((x) => x.id === b.dataset.id);
              if (!p) return;
              const cur = state.cart.get(p.id);
              state.cart.set(p.id, { product: p, qty: (cur?.qty || 0) + 1 });
              drawCart();
            }),
          );
      }
      function drawCart() {
        if (!state.cart.size) {
          $("cartList").innerHTML = `<div class="empty">ยังไม่มีสินค้า</div>`;
        } else {
          $("cartList").innerHTML = [...state.cart.values()]
            .map(
              ({ product, qty }) => `
      <div class="cart-line">
        <div class="c-name">${esc(product.name)}<br>
          <span class="muted" style="font-size:.78rem">฿${fmtTHB(product.price)} × ${qty}</span></div>
        <div class="qty-ctl">
          <button type="button" data-dec="${esc(product.id)}">−</button>
          <span>${qty}</span>
          <button type="button" data-inc="${esc(product.id)}">+</button>
        </div>
        <div style="min-width:80px;text-align:right;font-weight:700">฿${fmtTHB(product.price * qty)}</div>
      </div>`,
            )
            .join("");
          $("cartList")
            .querySelectorAll("[data-inc]")
            .forEach((b) =>
              b.addEventListener("click", () => {
                const id = b.dataset.inc,
                  cur = state.cart.get(id);
                if (cur) state.cart.set(id, { ...cur, qty: cur.qty + 1 });
                drawCart();
              }),
            );
          $("cartList")
            .querySelectorAll("[data-dec]")
            .forEach((b) =>
              b.addEventListener("click", () => {
                const id = b.dataset.dec,
                  cur = state.cart.get(id);
                if (!cur) return;
                if (cur.qty <= 1) state.cart.delete(id);
                else state.cart.set(id, { ...cur, qty: cur.qty - 1 });
                drawCart();
              }),

        $("tTotal").textContent = fmtTHB(total);

      <div>

        <div class="stat" style="margin-bottom:.8rem">

        </div>
        ${

          </label></div>`
            : ""
        }
        <label>หมายเหตุ</label>
        <input id="payNote" placeholder="ไม่บังคับ">
      </div>
    </div>
    <div id="payMsg" class="msg"></div>
    <div class="modal-actions">
      <button type="button" class="btn btn-ghost" data-a="cancel">กลับ</button>
      <button type="button" class="btn btn-primary" data-a="ok" style="min-width:180px">ยืนยันการขาย</button>
    </div></div></div>`);
        document.body.appendChild(m);

        let method = "cash";
        const methodBtns = m.querySelectorAll("#payMethods button");
        const cashWrap = m.querySelector("#cashWrap"),
          splitWrap = m.querySelector("#splitWrap");
        const payCash = m.querySelector("#payCash"),
          payChange = m.querySelector("#payChange");
        const splitCash = m.querySelector("#splitCash"),
          splitTr = m.querySelector("#splitTr"),
          splitMsg = m.querySelector("#splitMsg");
        const payMsg = m.querySelector("#payMsg"),
          redeemCheck = m.querySelector("#redeemCheck");

        const recalcChange = () => {
          const paid = Number(payCash.value) || 0;
          payChange.textContent = fmtTHB(Math.max(0, paid - total));
        };
        payCash.addEventListener("input", recalcChange);

        m.querySelectorAll("[data-q]").forEach((b) =>
          b.addEventListener("click", () => {
            const v = b.dataset.q;
            payCash.value = v === "exact" ? Math.ceil(total) : Number(v);
            recalcChange();

        );
        methodBtns.forEach((b) =>
          b.addEventListener("click", () => {
            methodBtns.forEach((x) => x.classList.remove("active"));
            b.classList.add("active");
            method = b.dataset.m;
            cashWrap.classList.toggle("hidden", method !== "cash");
            splitWrap.classList.toggle("hidden", method !== "split");
          }),
        );
        const checkSplit = () => {
          if (method !== "split") return true;
          const s =
            (Number(splitCash.value) || 0) + (Number(splitTr.value) || 0);
          const d = s - total;
          splitMsg.className = "msg";
          if (Math.abs(d) < 0.01) {
            splitMsg.textContent = "พอดี";
            splitMsg.classList.add("ok");
            return true;
          }
          splitMsg.textContent =
            d > 0 ? `เกิน ฿${fmtTHB(d)}` : `ขาด ฿${fmtTHB(-d)}`;
          splitMsg.classList.add("err");
          return false;
        };
        splitCash.addEventListener("input", checkSplit);
        splitTr.addEventListener("input", checkSplit);

        m.addEventListener("click", async (e) => {

          if (a === "cancel" || e.target === m) {
            m.remove();
            return;
          }
          if (a !== "ok") return;

          let payments;
          if (method === "cash") {

            if (paid + 0.001 < total) {
              setMsg(payMsg, "รับเงินน้อยกว่ายอดสุทธิ", "err");

            payments = [{ method: "cash", amount: total }];
            state.change = paid - total;

            payments = [{ method: "transfer", amount: total }];
            state.change = 0;
          } else {
            if (!checkSplit()) return;
            const sc = Number(splitCash.value) || 0,
              st = Number(splitTr.value) || 0;
            payments = [];
            if (sc > 0) payments.push({ method: "cash", amount: sc });
            if (st > 0) payments.push({ method: "transfer", amount: st });

            e.target.textContent = "ยืนยันการขาย";

      async function commitSale({ payments, note }) {
        const shopId = state.shopId;
        const token = state.clientToken || (state.clientToken = newToken());
        const { subtotal, discount, total } = calcTotals();
        const paid = payments.reduce((s, p) => s + Number(p.amount || 0), 0);
        if (Math.abs(paid - total) > 0.009) throw new Error("ยอดชำระไม่ตรง");

        const saleRef = doc(db, C.sales, token);
        const memberRef = doc(db, C.members, state.member.id);
        const shiftRef = doc(db, C.shifts, state.shift.id);

        const items = [...state.cart.values()].map(({ product, qty }) => ({
          productId: product.id,
          name: product.name,
          sku: product.sku || "",
          unit: product.unit || "ชิ้น",
          price: Number(product.price || 0),
          cost: Number(product.cost || 0),
          qty,
          lineTotal: Number(product.price || 0) * qty,
        }));

        const recipeRefs = items.map((it) => doc(db, C.recipes, it.productId));
        const prodRefs = items.map((it) => doc(db, C.products, it.productId));
        const ckey = `bill_${shopId}_${dateKey().replace(/-/g, "")}`;
        const cRef = doc(db, C.counters, ckey);
        const gpPct = getGpPct(shopId);

        const billNo = await runTransaction(db, async (tx) => {
          // READS
          const dup = await tx.get(saleRef);
          if (dup.exists()) {
            const e = new Error("บันทึกซ้ำ");
            e.code = "duplicate";
            throw e;
          }
          const memberSnap = await tx.get(memberRef);
          if (!memberSnap.exists()) throw new Error("ไม่พบสมาชิก");
          const recipeSnaps = await Promise.all(
            recipeRefs.map((r) => tx.get(r)),
          );
          const prodSnaps = await Promise.all(prodRefs.map((r) => tx.get(r)));
          const cSnap = await tx.get(cRef);
          const shSnap = await tx.get(shiftRef);

          const deductions = new Map();
          const pushDed = (sid, pid, q) => {
            if (!pid || !q) return;
            const k = invDocId(sid, pid);
            const c = deductions.get(k) || {
              shopId: sid,
              productId: pid,
              qty: 0,
            };
            c.qty += q;
            deductions.set(k, c);
          };
          items.forEach((it, i) => {
            const rec = recipeSnaps[i].exists() ? recipeSnaps[i].data() : null;
            const prd = prodSnaps[i].exists() ? prodSnaps[i].data() : null;
            const ings = Array.isArray(rec?.ingredients) ? rec.ingredients : [];
            if (ings.length) {
              ings.forEach((ing) =>
                pushDed(
                  ing.fromShopId || shopId,
                  ing.productId,
                  Number(ing.qty || 0) * it.qty,
                ),
              );
            } else if (prd?.trackStock !== false) {
              pushDed(shopId, it.productId, it.qty);
            }
          });
          const invArr = [...deductions.values()];
          const invSnaps = await Promise.all(
            invArr.map((d) =>
              tx.get(doc(db, C.inventory, invDocId(d.shopId, d.productId))),
            ),
          );

          invSnaps.forEach((snap, i) => {
            const d = invArr[i];
            const have = snap.exists() ? Number(snap.data().qty || 0) : 0;
            const track = snap.exists()
              ? snap.data().trackStock !== false
              : true;
            if (track && have < d.qty) {
              const p = items.find((x) => x.productId === d.productId);
              throw new Error(
                `สต๊อกไม่พอ: ${p?.name || d.productId} (เหลือ ${have}, ใช้ ${d.qty})`,
              );
            }
          });

          const memberData = memberSnap.data();
          const pts = { ...emptyPoints(), ...(memberData.points || {}) };
          const before = Number(pts[shopId] || 0);
          // ★ คิดแต้มแบบใหม่ — ส่ง items เข้าไปด้วย
          const earned = calcEarned(shopId, total, items);
          const threshold = redeemThreshold(shopId);
          const willRedeem = !!state.redeem;
          if (willRedeem && before < threshold) throw new Error("คะแนนไม่พอ");
          const after = before - (willRedeem ? threshold : 0) + earned;
          pts[shopId] = after;

          const spent = { ...emptyPoints(), ...(memberData.totalSpent || {}) };
          spent[shopId] = Number(spent[shopId] || 0) + total;

          const seq = (cSnap.exists() ? Number(cSnap.data().seq || 0) : 0) + 1;
          const billNo = `${SHOPS[shopId].prefix}-${dateKey().replace(/-/g, "")}-${String(seq).padStart(4, "0")}`;
          const grossCost = items.reduce((s, it) => s + it.cost * it.qty, 0);
          const gpAmount = (total * gpPct) / 100;

          // WRITES
          tx.set(cRef, { seq, updatedAt: serverTimestamp() }, { merge: true });

          tx.set(saleRef, {
            billNo,
            shopId,
            shiftId: state.shift.id,
            clientToken: token,
            memberId: memberRef.id,
            memberPhoneMasked: memberData.phoneMasked || "",
            memberNickname: memberData.nickname || "",
            memberDisplayName: memberData.displayName || "",
            itemsCount: items.reduce((s, it) => s + it.qty, 0),
            subtotal,
            discount,
            total,
            grossCost,
            gpPct,
            gpAmount,
            payments: payments.map((p) => ({
              method: p.method,
              amount: Number(p.amount),
            })),
            paymentSummary: payments.map((p) => p.method).join("+"),
            cashReceived: payments
              .filter((p) => p.method === "cash")
              .reduce((s, p) => s + Number(p.amount), 0),
            transferReceived: payments
              .filter((p) => p.method === "transfer")
              .reduce((s, p) => s + Number(p.amount), 0),
            change: Number(state.change || 0),
            status: "completed",
            pointsEarned: earned,
            pointsRedeemed: willRedeem ? threshold : 0,
            pointsAfter: after,
            note: note || "",
            createdAt: serverTimestamp(),
            dateKey: dateKey(),
          });

          items.forEach((it, i) => {
            tx.set(doc(collection(db, C.sales, token, C.saleItems)), {
              ...it,
              lineIndex: i,
              createdAt: serverTimestamp(),
            });
          });

          invSnaps.forEach((snap, i) => {
            const d = invArr[i];
            const have = snap.exists() ? Number(snap.data().qty || 0) : 0;
            const afterQty = have - d.qty;
            tx.set(
              doc(db, C.inventory, invDocId(d.shopId, d.productId)),
              {
                shopId: d.shopId,
                productId: d.productId,
                qty: afterQty,
                updatedAt: serverTimestamp(),
              },
              { merge: true },
            );
            tx.set(doc(collection(db, C.inventoryMovements)), {
              shopId: d.shopId,
              productId: d.productId,
              type: "sale_deduct",
              qty: -d.qty,
              qtyBefore: have,
              qtyAfter: afterQty,
              refType: "sale",
              refId: token,
              billNo,
              reason: `ขายบิล ${billNo}`,
              createdAt: serverTimestamp(),
              dateKey: dateKey(),
            });
          });

          tx.update(memberRef, {
            points: pts,
            totalSpent: spent,
            lastVisitAt: serverTimestamp(),
          });

          if (earned > 0) {
            tx.set(doc(collection(db, C.pointTransactions)), {
              memberId: memberRef.id,
              shopId,
              delta: earned,
              balanceBefore: before - (willRedeem ? threshold : 0),
              balanceAfter: after,
              type: "earn",
              reason: `สะสมจากบิล ${billNo}`,
              refType: "sale",
              refId: token,
              billNo,
              createdAt: serverTimestamp(),
              dateKey: dateKey(),
            });
          }
          if (willRedeem) {
            tx.set(doc(collection(db, C.pointTransactions)), {
              memberId: memberRef.id,
              shopId,
              delta: -threshold,
              balanceBefore: before,
              balanceAfter: before - threshold + earned,
              type: "redeem",
              reason: `แลกรางวัลในบิล ${billNo}`,
              refType: "sale",
              refId: token,
              billNo,
              createdAt: serverTimestamp(),
              dateKey: dateKey(),
            });
          }

          const cash = payments
            .filter((p) => p.method === "cash")
            .reduce((s, p) => s + Number(p.amount), 0);
          const tr = payments
            .filter((p) => p.method === "transfer")
            .reduce((s, p) => s + Number(p.amount), 0);
          const sd = shSnap.exists() ? shSnap.data() : {};
          tx.update(shiftRef, {
            cashSales: Number(sd.cashSales || 0) + cash,
            transferSales: Number(sd.transferSales || 0) + tr,
            salesTotal: Number(sd.salesTotal || 0) + total,
            billCount: Number(sd.billCount || 0) + 1,
          });

          return billNo;
        });

        await audit("sale.create", { saleId: token, billNo, shopId, total });
        state.clientToken = null;
        // ★ คิดแต้มแบบใหม่หลัง commit (ใช้ items array)
        const earned = calcEarned(shopId, total, items);
        return {
          saleId: token,

      async function adjustStock(shopId, productId, delta, type, reason) {
        const d = Number(delta);
        if (!d) throw new Error("จำนวนต้องไม่เป็น 0");
        const invRef = doc(db, C.inventory, invDocId(shopId, productId));
        const prodRef = doc(db, C.products, productId);
        await runTransaction(db, async (tx) => {
          const inv = await tx.get(invRef);
          const p = await tx.get(prodRef);
          const before = inv.exists() ? Number(inv.data().qty || 0) : 0;
          const after = before + d;
          if (after < 0) throw new Error(`สต๊อกไม่พอ (เหลือ ${before})`);
          const pdata = p.exists() ? p.data() : {};
          tx.set(
            invRef,
            {
              shopId,
              productId,
              productName: pdata.name || productId,
              unit: pdata.unit || "ชิ้น",
              minQty: Number(pdata.minQty || 0),
              qty: after,
              updatedAt: serverTimestamp(),
            },
            { merge: true },
          );
          tx.set(doc(collection(db, C.inventoryMovements)), {
            shopId,
            productId,
            productName: pdata.name || productId,
            type,
            qty: d,
            qtyBefore: before,
            qtyAfter: after,
            reason,
            refType: "manual",
            createdAt: serverTimestamp(),
            dateKey: dateKey(),
          });
        });
        await audit("stock.adjust", {
          shopId,
          productId,
          delta: d,
          type,
          reason,
        });
      }

      async function transferStock(from, to, productId, qty, reason) {
        const q = Number(qty);
        const fromRef = doc(db, C.inventory, invDocId(from, productId));
        const toRef = doc(db, C.inventory, invDocId(to, productId));
        const pRef = doc(db, C.products, productId);
        await runTransaction(db, async (tx) => {
          const f = await tx.get(fromRef);
          const t = await tx.get(toRef);
          const p = await tx.get(pRef);
          const fB = f.exists() ? Number(f.data().qty || 0) : 0;
          if (fB < q) throw new Error(`สต๊อกต้นทางไม่พอ (เหลือ ${fB})`);
          const tB = t.exists() ? Number(t.data().qty || 0) : 0;
          const name = p.exists() ? p.data().name : productId;
          const unit = p.exists() ? p.data().unit || "ชิ้น" : "ชิ้น";
          tx.set(
            fromRef,
            {
              shopId: from,
              productId,
              productName: name,
              unit,
              qty: fB - q,
              updatedAt: serverTimestamp(),
            },
            { merge: true },
          );
          tx.set(
            toRef,
            {
              shopId: to,
              productId,
              productName: name,
              unit,
              qty: tB + q,
              updatedAt: serverTimestamp(),
            },
            { merge: true },
          );
          const base = {
            productId,
            productName: name,
            qty: q,
            reason,
            refType: "transfer",
            createdAt: serverTimestamp(),
            dateKey: dateKey(),
          };
          tx.set(doc(collection(db, C.inventoryMovements)), {
            ...base,
            shopId: from,
            type: "transfer_out",
            qty: -q,
            qtyBefore: fB,
            qtyAfter: fB - q,
          });
          tx.set(doc(collection(db, C.inventoryMovements)), {
            ...base,
            shopId: to,
            type: "transfer_in",
            qty: q,
            qtyBefore: tB,
            qtyAfter: tB + q,
          });
        });
        await audit("stock.transfer", { from, to, productId, qty: q, reason });
      }

            modal.remove();
            return;
          }
          if (a !== "ok") return;
          const shopId = modal.querySelector("#adjShop").value;

          const reason = modal.querySelector("#adjReason").value.trim();
          if (!delta) {

            setMsg(err, "ต้องระบุเหตุผล", "err");

              const pts = { ...emptyPoints(), ...(snap.data().points || {}) };

              tx.update(mRef, { points: pts, updatedAt: serverTimestamp() });
              tx.set(txRef, {

                shopId,
                delta,
                balanceBefore: before,
                balanceAfter: next,
                type: delta > 0 ? "adjust_add" : "adjust_deduct",
                reason,
                refType: "manual",
                refId: null,
                createdAt: serverTimestamp(),
                dateKey: dateKey(),

              delta,
              reason,

            toast(`ปรับแล้ว — คงเหลือ ${after} แต้ม`, "ok");

          } catch (e2) {
            setMsg(err, e2.message, "err");
            e.target.disabled = false;
          }
        });
