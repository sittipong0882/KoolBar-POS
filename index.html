            grandTransfer = 0,
            grandGp = 0;

          for (const s of sales) {
            if (s.status !== "completed") continue;
            const sid = s.shopId;
            if (!byShop[sid]) continue;
            const t = Number(s.total || 0);
            const c = Number(s.grossCost || 0);
            byShop[sid].total += t;
            byShop[sid].cost += c;
            byShop[sid].count += 1;
            for (const p of s.payments || []) {
              if (p.method === "cash")
                byShop[sid].cash += Number(p.amount || 0);
              if (p.method === "transfer")
                byShop[sid].transfer += Number(p.amount || 0);
            }
            grandTotal += t;
            grandCost += c;
          }
          for (const sid of SHOP_IDS) {
            const bs = byShop[sid];
            bs.grossProfit = bs.total - bs.cost;
            bs.gp = (bs.total * bs.gpPct) / 100;
            bs.netAfterGp = bs.grossProfit - bs.gp;
            grandGp += bs.gp;
            grandCash += bs.cash;
            grandTransfer += bs.transfer;
          }

          const expTotal = expenses.reduce(
            (a, e) => a + Number(e.amount || 0),
            0,
          );
          const profit = grandTotal - grandCost - expTotal - grandGp;

          const topMap = new Map();
          for (const s of sales) {
            if (s.status !== "completed") continue;
            try {
              const itemsSnap = await getDocs(
                collection(db, C.sales, s.id, C.saleItems),
              );
              for (const dd of itemsSnap.docs) {
                const it = dd.data();
                const cur = topMap.get(it.productId) || {
                  name: it.name,
                  qty: 0,
                  revenue: 0,
                };
                cur.qty += Number(it.qty || 0);
                cur.revenue += Number(it.lineTotal || 0);
                topMap.set(it.productId, cur);
              }
            } catch (e) {}
          }
          const top = [...topMap.values()]
            .sort((a, b) => b.revenue - a.revenue)
            .slice(0, 15);

          $("rpBody").innerHTML = `
      <div class="grid g4">
        <div class="stat"><div class="lbl">ยอดขายสุทธิ</div><div class="val">฿${fmtTHB(grandTotal)}</div>
          <div class="muted" style="font-size:.75rem">${sales.filter((s) => s.status === "completed").length} บิล</div></div>
        <div class="stat"><div class="lbl">ต้นทุนขาย</div><div class="val sm">฿${fmtTHB(grandCost)}</div></div>
        <div class="stat"><div class="lbl">กำไรขั้นต้น</div>
          <div class="val sm" style="color:var(--green)">฿${fmtTHB(grandTotal - grandCost)}</div></div>
        <div class="stat"><div class="lbl">GP รวม</div><div class="val sm">฿${fmtTHB(grandGp)}</div></div>
      </div>

      <div class="card" style="margin-top:1rem">
        <h4>💼 GP แยกร้าน</h4>
        <div class="grid g2">
          ${SHOP_IDS.map((sid) => {
            const bs = byShop[sid];
            return `<div class="gp-card">
              <div class="gp-shop">${esc(SHOPS[sid].name)} (GP ${bs.gpPct}%)</div>
              <div class="grid g2" style="gap:.5rem;margin-top:.5rem">
                <div>
                  <div class="muted" style="font-size:.72rem">ยอดขาย</div>
                  <div style="font-weight:800;font-size:1.1rem">฿${fmtTHB(bs.total)}</div>
                  <div class="muted" style="font-size:.72rem">${bs.count} บิล • ต้นทุน ฿${fmtTHB(bs.cost)}</div>
                </div>
                <div>
                  <div class="muted" style="font-size:.72rem">GP ที่ต้องจ่าย</div>
                  <div class="gp-amount">฿${fmtTHB(bs.gp)}</div>
                </div>
              </div>
              <div style="margin-top:.6rem;padding-top:.6rem;border-top:1px dashed var(--line)">
                <div style="display:flex;justify-content:space-between;font-size:.85rem">
                  <span class="muted">กำไรขั้นต้น − GP:</span>
                  <b style="color:${bs.netAfterGp >= 0 ? "var(--green)" : "var(--red)"}">฿${fmtTHB(bs.netAfterGp)}</b>
                </div>
              </div>
            </div>`;
          }).join("")}
        </div>
        <div class="gp-card" style="margin-top:.75rem;border-left-color:var(--green)">
          <div class="gp-shop">รวม GP ทั้งกิจการ</div>
          <div class="gp-amount" style="color:var(--green)">฿${fmtTHB(grandGp)}</div>
          <div class="gp-meta">= ฿${fmtTHB(byShop.meath.gp)} (${esc(SHOPS.meath.name)}) + ฿${fmtTHB(byShop.drink.gp)} (${esc(SHOPS.drink.name)})</div>
        </div>
      </div>

      <div class="grid g3" style="margin-top:1rem">
        <div class="stat"><div class="lbl">เงินสด</div><div class="val sm">฿${fmtTHB(grandCash)}</div></div>
        <div class="stat"><div class="lbl">เงินโอน</div><div class="val sm">฿${fmtTHB(grandTransfer)}</div></div>
        <div class="stat"><div class="lbl">รายจ่าย</div><div class="val sm" style="color:var(--red)">฿${fmtTHB(expTotal)}</div></div>
      </div>
      <div class="card" style="margin-top:1rem">
        <h3>กำไรหลังหักทุกอย่าง</h3>
        <div style="font-size:2rem;font-weight:800;color:${profit >= 0 ? "var(--green)" : "var(--red)"}">฿${fmtTHB(profit)}</div>
        <p class="hint">= ยอดขาย − ต้นทุนขาย − GP รวม − รายจ่าย</p>
      </div>

      <div class="card">
        <h3>สินค้าขายดี Top 15</h3>
        ${
          top.length
            ? `<div class="table-wrap"><table>
          <thead><tr><th>สินค้า</th><th style="text-align:right">จำนวน</th><th style="text-align:right">รายได้</th></tr></thead>
          <tbody>${top
            .map(
              (t) => `<tr><td>${esc(t.name)}</td>
            <td style="text-align:right">${t.qty}</td>
            <td style="text-align:right">฿${fmtTHB(t.revenue)}</td></tr>`,
            )
            .join("")}</tbody>
        </table></div>`
            : `<div class="empty">ไม่มีข้อมูล</div>`
        }
      </div>`;
        };
        $("btnRunRp").addEventListener("click", run);
        $("btnExpSales").addEventListener("click", () => {
          downloadCSV(
            `sales-${dateKey()}.csv`,
            [
              "บิล",
              "วันที่",
              "ร้าน",
              "สมาชิก",
              "สุทธิ",
              "GP%",
              "GP(บาท)",
              "วิธีชำระ",
              "ต้นทุน",
              "กำไรขั้นต้น",
              "แต้ม+",
              "แต้ม−",
              "สถานะ",
            ],
            lastSales.map((s) => [
              s.billNo,
              fmtDT(s.createdAt),
              shopName(s.shopId),
              `${s.memberDisplayName || ""} ${s.memberPhoneMasked || ""}`.trim(),
              Number(s.total || 0).toFixed(2),
              Number(s.gpPct || 0).toFixed(2),
              Number(s.gpAmount || 0).toFixed(2),
              (s.payments || [])
                .map((p) => `${p.method}:${Number(p.amount).toFixed(2)}`)
                .join(" | "),
              Number(s.grossCost || 0).toFixed(2),
              (Number(s.total || 0) - Number(s.grossCost || 0)).toFixed(2),
              s.pointsEarned || 0,
              s.pointsRedeemed || 0,
              s.status === "completed" ? "สำเร็จ" : "ยกเลิก",
            ]),
          );
        });
        await run();
      }

      /* ---------- SETTINGS ---------- */
      async function renderSettings() {
        const [pt, shop] = await Promise.all([
          getSetting("points"),
          getSetting("shop"),
        ]);
        const cfg = pt?.shops || DEFAULT_POINTS.shops;
        const gp = { ...DEFAULT_GP, ...(shop?.gpPercent || {}) };

        $("view").innerHTML = `
    <div class="card">
      <h3>กติกาสะสมแต้ม</h3>
      <p class="hint">
        <b>โหมด "นับเป็นถ้วย"</b> = นับจำนวนชิ้น/ถ้วยในบิล × แต้มต่อถ้วย<br>
        ตัวอย่าง: ซื้อ 3 ถ้วยในบิลเดียว → ได้ 3 แต้ม (ไม่ใช่ 1 แต้มต่อบิล)
      </p>
      <div class="grid g2">
        ${SHOP_IDS.map((sid) => {
          const c = cfg[sid] || {};
          return `<div class="card" style="background:var(--bg3)">
            <h4>${esc(SHOPS[sid].name)}</h4>
            <label>รูปแบบการคิดแต้ม</label>
            <select data-pt="${sid}" data-k="mode" class="ptMode">
              <option value="perUnit" ${c.mode === "perUnit" ? "selected" : ""}>🥤 นับเป็นถ้วย (แนะนำ)</option>
              <option value="perBill" ${c.mode === "perBill" ? "selected" : ""}>🧾 แต้มต่อบิล</option>
              <option value="perAmount" ${c.mode === "perAmount" ? "selected" : ""}>💰 แต้มตามยอดซื้อ</option>
            </select>
            <label>แต้มต่อ 1 ถ้วย (หน่วย)</label>
            <input type="number" min="0" step="0.1" data-pt="${sid}" data-k="pointsPerUnit" value="${Number(c.pointsPerUnit !== undefined ? c.pointsPerUnit : 1)}">
            <label>แต้มต่อบิล <span class="muted">(ใช้เมื่อเลือกโหมด "แต้มต่อบิล")</span></label>
            <input type="number" min="0" data-pt="${sid}" data-k="pointsPerBill" value="${Number(c.pointsPerBill || 0)}">
            <label>ทุกกี่บาท = 1 แต้ม <span class="muted">(ใช้เมื่อเลือกโหมด "ตามยอดซื้อ")</span></label>
            <input type="number" min="0" data-pt="${sid}" data-k="amountPerPoint" value="${Number(c.amountPerPoint || 0)}">
            <label>แต้มที่ใช้แลกรางวัล</label>
            <input type="number" min="1" data-pt="${sid}" data-k="redeemThreshold" value="${Number(c.redeemThreshold || 10)}">
            <label>รายละเอียดรางวัล</label>
            <input data-pt="${sid}" data-k="rewardDescription" value="${esc(c.rewardDescription || "")}" placeholder="เช่น แลกฟรี 1 รายการ">
          </div>`;
        }).join("")}
      </div>
      <button type="button" class="btn btn-primary" id="btnSavePt" style="margin-top:.8rem">บันทึกกติกาคะแนน</button>
      <div class="msg" id="ptMsg"></div>
    </div>

    <div class="card">
      <h3>เปอร์เซ็นต์ GP แยกร้าน</h3>
      <div class="grid g3">
        <div>
          <label>ค่าเริ่มต้น (%)</label>
          <input type="number" min="0" max="100" step="0.01" id="gpDefault" value="${Number(gp.default || 0)}">
        </div>
        <div>
          <label>${esc(SHOPS.meath.name)} (%)</label>
          <input type="number" min="0" max="100" step="0.01" id="gpMeath" value="${Number(gp.meath || 0)}">
        </div>
        <div>
          <label>${esc(SHOPS.drink.name)} (%)</label>
          <input type="number" min="0" max="100" step="0.01" id="gpDrink" value="${Number(gp.drink || 0)}">
        </div>
      </div>
      <button type="button" class="btn btn-primary" id="btnSaveGP" style="margin-top:.8rem">บันทึกค่า GP</button>
      <div class="msg" id="gpMsg"></div>
    </div>

    <div class="card">
      <h3>ℹ️ ข้อมูลระบบ</h3>
      <div class="table-wrap"><table>
        <tbody>
          <tr><td>ชื่อผู้ใช้แอดมิน</td><td><b>${LOGIN_USER}</b></td></tr>
          <tr><td>Firebase Project</td><td>kool-bar</td></tr>
          <tr><td>ร้านย่อย</td><td>${SHOP_IDS.map((s) => esc(SHOPS[s].name)).join(" • ")}</td></tr>
        </tbody>
      </table></div>
    </div>

    <div class="card">
      <h3>🗑 ล้างข้อมูล (ใช้ระวัง)</h3>
      <button type="button" class="btn btn-danger" id="btnWipe">ล้างข้อมูลทั้งหมด</button>
      <div class="msg" id="wipeMsg"></div>
    </div>
  `;

        $("btnSavePt").addEventListener("click", async () => {
          const next = { shops: {} };
          SHOP_IDS.forEach((sid) => {
            next.shops[sid] = {
              mode: "perUnit",
              pointsPerUnit: 1,
              pointsPerBill: 0,
              amountPerPoint: 0,
              redeemThreshold: 10,
              rewardDescription: "",
            };
            $("view")
              .querySelectorAll(`[data-pt="${sid}"]`)
              .forEach((inp) => {
                const k = inp.dataset.k;
                next.shops[sid][k] =
                  k === "mode" || k === "rewardDescription"
                    ? inp.value
                    : Number(inp.value) || 0;
              });
            // ถ้าโหมด perUnit แตะแต่ค่า 0 → ตั้งค่าเริ่มต้นเป็น 1
            if (
              next.shops[sid].mode === "perUnit" &&
              !next.shops[sid].pointsPerUnit
            ) {
              next.shops[sid].pointsPerUnit = 1;
            }
          });
          try {
            await saveSetting("points", next);
            await audit("settings.points", next.shops);
            state.pointsCfg = next;
            toast("บันทึกกติกาคะแนนแล้ว", "ok");
          } catch (e) {
            setMsg($("ptMsg"), e.message, "err");
          }
        });

        $("btnSaveGP").addEventListener("click", async () => {
          try {
            const data = {
              gpPercent: {
                default: Number($("gpDefault").value) || 0,
                meath: Number($("gpMeath").value) || 0,
                drink: Number($("gpDrink").value) || 0,
              },
            };
            await saveSetting("shop", data);
            await audit("settings.gp", data);
            state.gpPercent = data.gpPercent;
            toast("บันทึก GP แล้ว", "ok");
          } catch (e) {
            setMsg($("gpMsg"), e.message, "err");
          }
        });

        $("btnWipe").addEventListener("click", async () => {
          const ok = await confirmDialog(
            "⚠ ลบข้อมูลการขาย สต๊อก ความเคลื่อนไหว และการตั้งค่าทั้งหมด?\n\n(สมาชิก/สินค้า/สูตร จะยังอยู่)",
            { title: "ยืนยันล้างข้อมูล", okText: "ลบเลย", danger: true },
          );
          if (!ok) return;
          const cols = [
            C.sales,
            C.inventoryMovements,
            C.expenses,
            C.shifts,
            C.auditLogs,
            C.counters,
          ];
          let n = 0;
          try {
            for (const col of cols) {
              const snap = await getDocs(collection(db, col));
              if (col === C.sales) {
                for (const d of snap.docs) {
                  const items = await getDocs(
                    collection(db, C.sales, d.id, C.saleItems),
                  );
                  for (const it of items.docs) {
                    await deleteDoc(it.ref);
                    n++;
                  }
                }
              }
              for (const d of snap.docs) {
                await deleteDoc(d.ref);
                n++;
              }
            }
            toast(`ลบไปทั้งหมด ${n} รายการ`, "ok");
          } catch (e) {
            setMsg($("wipeMsg"), e.message, "err");
          }
        });
      }

      /* =========================================================
   INIT
   ========================================================= */
      async function bootApp() {
        try {
          await loadSettings();
        } catch (e) {
          console.warn("init loadSettings:", e);
        }

        const btnCheck = $("btnCheckPoints");
        if (btnCheck) btnCheck.addEventListener("click", checkPoints);

        const phoneIn = $("phoneInput");
        if (phoneIn) {
          phoneIn.addEventListener("keydown", (e) => {
            if (e.key === "Enter") checkPoints();
          });
          phoneIn.addEventListener("input", (e) => {
            e.target.value = e.target.value.replace(/\D/g, "").slice(0, 10);
          });
        }

        const btnAdm = $("btnAdminLogin");
        if (btnAdm) {
          const fresh = btnAdm.cloneNode(true);
          btnAdm.parentNode.replaceChild(fresh, btnAdm);

          const handler = (e) => {
            e.preventDefault();
            e.stopPropagation();
            if (typeof e.stopImmediatePropagation === "function")
              e.stopImmediatePropagation();
            try {
              openLoginModal();
            } catch (err) {
              console.error("openLoginModal error:", err);
              alert("เปิดหน้าล็อกอินไม่ได้: " + err.message);
            }
          };
          fresh.addEventListener("click", handler, true);
          fresh.addEventListener("pointerup", handler, true);
          fresh.addEventListener(
            "touchend",
            (e) => {
              e.preventDefault();
              handler(e);
            },
            { capture: true, passive: false },
          );

          console.log("[Kool Bar] ปุ่มแอดมินพร้อมใช้งาน ✅");
        }

        const btnOut = $("btnLogout");
        if (btnOut) btnOut.addEventListener("click", doLogout);

        const btnBack = $("btnBackPublic");
        if (btnBack)
          btnBack.addEventListener("click", () => {
            showPublicView();
          });

        if (localStorage.getItem(SESSION_KEY) === "1") {
          state.isAdmin = true;
          showAdminView();
          renderNav();
          try {
            await navigate("dashboard");
          } catch (e) {
            console.error(e);
          }
          return;
        }

        showPublicView();
        setTimeout(() => {
          try {
            if (phoneIn) phoneIn.focus();
          } catch (e) {}
        }, 300);
      }

      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", () => {
          bootApp().catch((err) => {
            console.error("bootApp failed", err);
            document.body.innerHTML = `<div style="padding:2rem;color:#fff;font-family:sans-serif">
        <h2>❌ เริ่มระบบไม่สำเร็จ</h2>
        <p>${esc(err.message)}</p>
      </div>`;
          });
        });
      } else {
        bootApp().catch((err) => {
          console.error("bootApp failed", err);
          document.body.innerHTML = `<div style="padding:2rem;color:#fff;font-family:sans-serif">
      <h2>❌ เริ่มระบบไม่สำเร็จ</h2>
      <p>${esc(err.message)}</p>
    </div>`;
        });
      }
    </script>
  </body>
</html>
